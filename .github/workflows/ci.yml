name: CI & Automated Test Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore -c Release

    - name: Execute Full Test Suite (41 Tests)
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Run Hostfix Self-Audit (Windows Only)
      if: runner.os == 'Windows'
      run: |
        dotnet run --project src/PuviDoctor.Cli -c Release -- ci