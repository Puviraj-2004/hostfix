name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: hostfix-win-x64.exe
            src: src/PuviDoctor.Cli/bin/Release/net9.0/win-x64/publish/PuviDoctor.Cli.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: hostfix-linux-x64
            src: src/PuviDoctor.Cli/bin/Release/net9.0/linux-x64/publish/PuviDoctor.Cli
          - os: macos-latest
            rid: osx-arm64
            binary: hostfix-osx-arm64
            src: src/PuviDoctor.Cli/bin/Release/net9.0/osx-arm64/publish/PuviDoctor.Cli

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Self-Contained Single-File Binary
      run: |
        dotnet publish src/PuviDoctor.Cli/PuviDoctor.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true

    - name: Rename Binary
      shell: bash
      run: |
        mkdir -p dist
        cp ${{ matrix.src }} dist/${{ matrix.binary }}
        cd dist
        sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/${{ matrix.binary }}
          dist/${{ matrix.binary }}.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}